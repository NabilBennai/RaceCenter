spring.application.name=RaceCenter Backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/racecenter}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:racecenter}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:racecenter}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

app.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me-change-me}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
