<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" routerLink="/dashboard">RaceCenter</a>
    <span class="spacer"></span>
    @if (isAuthenticated()) {
    <a class="btn btn-ghost text-white" routerLink="/profile">Mon profil</a>
    <span class="user-pill">{{ currentUser()?.username }}</span>
    <button class="btn btn-outline text-white" type="button" (click)="logout()">
      Se deconnecter
    </button>
    } @else {
    <a class="btn btn-ghost text-white" routerLink="/login">Connexion</a>
    <a class="btn btn-primary" routerLink="/register">Creer un compte</a>
    }
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
