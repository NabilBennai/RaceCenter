<section class="auth-shell">
  <div class="auth-card">
    <h1 class="text-2xl font-bold text-white">Nouveau mot de passe</h1>
    <p class="mt-1 text-slate-100">Définis ton nouveau mot de passe.</p>
    <form [formGroup]="form" class="auth-form mt-4" (ngSubmit)="submit()">
      <label class="field-label" for="password">Nouveau mot de passe</label>
      <input class="field-input" id="password" type="password" formControlName="password" />

      <label class="field-label" for="confirmPassword">Confirmation</label>
      <input
        class="field-input"
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
      />
      @if (passwordsMismatch() && form.controls.confirmPassword.touched) {
        <p class="field-error">Les mots de passe ne correspondent pas</p>
      }

      <button class="submit-btn" type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Validation...' : 'Réinitialiser' }}
      </button>
    </form>
    <a
      class="mt-5 inline-block text-sm font-medium text-sky-300 hover:text-sky-200"
      routerLink="/login"
    >
      Retour connexion
    </a>
  </div>
</section>
