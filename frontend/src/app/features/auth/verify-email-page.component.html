<section class="auth-shell">
  <div class="auth-card verify-card">
    <h1 class="text-2xl font-bold text-white">Vérification e-mail</h1>
    <p class="mt-2 text-slate-100">{{ message() }}</p>

    @if (status() === 'loading') {
      <p class="mt-4 text-sm text-slate-300">Merci de patienter...</p>
    }
    @if (status() === 'success') {
      <a class="mt-6 inline-flex text-sm font-medium text-sky-300 hover:text-sky-200" routerLink="/login">
        Aller à la connexion
      </a>
    }
    @if (status() === 'error') {
      <a class="mt-6 inline-flex text-sm font-medium text-sky-300 hover:text-sky-200" routerLink="/register">
        Revenir à l’inscription
      </a>
    }
  </div>
</section>
