<section class="auth-shell">
  <div class="auth-card">
    <h1 class="text-2xl font-bold text-white">Mot de passe oublié</h1>
    <p class="mt-1 text-slate-100">On t'envoie un lien de réinitialisation par e-mail.</p>
    <form [formGroup]="form" class="auth-form mt-4" (ngSubmit)="submit()">
      <label class="field-label" for="email">Email</label>
      <input class="field-input" id="email" type="email" formControlName="email" />
      <button class="submit-btn" type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Envoi...' : 'Envoyer le lien' }}
      </button>
    </form>
    <a
      class="mt-5 inline-block text-sm font-medium text-sky-300 hover:text-sky-200"
      routerLink="/login"
    >
      Retour connexion
    </a>
  </div>
</section>
