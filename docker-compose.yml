services:
  postgres:
    image: postgres:18-alpine
    container_name: racecenter-postgres
    environment:
      POSTGRES_DB: racecenter
      POSTGRES_USER: racecenter
      POSTGRES_PASSWORD: racecenter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racecenter -d racecenter"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: racecenter-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
